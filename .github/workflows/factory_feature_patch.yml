name: Factory feature patch

on:
  push:
    branches:
      - feature/manga-factory-export

permissions:
  contents: write

concurrency:
  group: factory-feature-patch
  cancel-in-progress: false

jobs:
  patch-build-commit:
    if: "!contains(github.event.head_commit.message, '[factory-patched]')"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/manga-factory-export
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply UI patch
        run: python tools/apply-manga-factory-export-patch.py

      - name: Build preview APK
        run: ./gradlew :app:assemblePreview -Penable-updater

      - name: Commit generated UI patch
        run: |
          if git diff --quiet; then
            echo "No generated patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/eu/kanade/presentation/components/DownloadDropdownMenu.kt \
                  app/src/main/java/eu/kanade/tachiyomi/ui/manga/MangaScreen.kt
          git commit -m "feat(factory): wire export action [factory-patched]"
          git push origin HEAD:feature/manga-factory-export

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: kotori-factory-preview-${{ github.sha }}
          path: app/build/outputs/apk/preview/app-arm64-v8a-preview.apk
